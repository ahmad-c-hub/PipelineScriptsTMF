rfe: |
  You are analyzing a USCIS Request for Evidence (RFE) notice.

  INSTRUCTIONS:
  - Scan the ENTIRE document before extracting any field
  - DO NOT infer missing values
  - Extract ONLY explicitly stated information
  - Return ONLY JSON

  PRIMARY FIELDS:

  rfe_issued:
    Always true for this document type.

  rfe_date:
    Date the RFE was issued → YYYY-MM-DD
    Look for "Notice Date" or date at top of letter.

  rfe_response_deadline:
    The deadline given to respond → YYYY-MM-DD
    Look for "you must respond by", "response due", or a specific date near
    "87 days" or "3 months".

  rfe_basis:
    The MAIN stated reason USCIS needs more evidence. Choose ONE:
      "Lack of independent corroboration"
      "Evidence insufficient"
      "Lack of originality"
      "General claims"
      "Evidence does not meet legal standard"
      "Overreliance on expert letters"
      "Other"

  rfe_criteria_challenged:
    Array of O-1A criteria USCIS explicitly challenged in this RFE:
      "Awards" | "Membership" | "Press" | "Judging" | "Original Contributions" |
      "Scholarly Articles" | "Critical Role" | "High Salary"
    Empty array [] if none named explicitly.

  officer_number:
    Alphanumeric code near signature or footer. Null if not found.

  service_center_or_field_office:
    Name of the USCIS office that issued the RFE.

  SECONDARY FIELDS — extract if explicitly stated in this RFE:
  {
    "petition_type": "string | null",
    "filing_date": "YYYY-MM-DD | null",
    "beneficiary_country_of_birth": "string | null",
    "beneficiary_country_of_citizenship": "string | null",
    "criteria_claimed_count": integer | null,
    "major_award_claimed": "Y | N | null",
    "publications_included": "Y | N | null",
    "judging_others_work_claimed": "Y | N | null",
    "high_salary_claimed": "Y | N | null",
    "eb2_basis": "Advanced Degree | Exceptional Ability | null",
    "endeavor_field": "Health | Energy | Tech | Public Policy | Other | null",
    "dhanasar_prong_focus": "Prong 1 | Prong 2 | Prong 3 | null"
  }

  WHERE TO LOOK FOR SECONDARY FIELDS IN AN RFE:
  - The RFE header restates petition_type, receipt number, and often filing_date
  - The officer's legal analysis names which specific criteria were claimed and
    which are being challenged — use this for all Y/N criteria fields
  - For NIW RFEs, the Dhanasar framework is named explicitly by prong

  Return EXACT JSON:
  {
    "rfe_issued": true,
    "rfe_date": null,
    "rfe_response_deadline": null,
    "rfe_basis": null,
    "rfe_criteria_challenged": [],
    "officer_number": null,
    "service_center_or_field_office": null,
    "petition_type": null,
    "filing_date": null,
    "beneficiary_country_of_birth": null,
    "beneficiary_country_of_citizenship": null,
    "criteria_claimed_count": null,
    "major_award_claimed": null,
    "publications_included": null,
    "judging_others_work_claimed": null,
    "high_salary_claimed": null,
    "eb2_basis": null,
    "endeavor_field": null,
    "dhanasar_prong_focus": null
  }

