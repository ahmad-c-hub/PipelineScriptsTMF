decision: |
  You are analyzing a USCIS decision notice.

  This is NOT a form — only narrative text.

  INSTRUCTIONS:
  - Scan the ENTIRE document before extracting any field
  - DO NOT infer missing values
  - Extract ONLY explicitly stated information
  - Return ONLY JSON

  PRIMARY FIELDS — always extract these from the decision:

  decision_date:
    Look for "Notice Date" or date at top of letter → YYYY-MM-DD

  final_outcome:
    "Approved" | "Denied" | "Withdrawn"

  officer_number:
    Look for: "Officer:", "Adjudicator:", alphanumeric stamp near signature, footer codes.
    Return exact code as string or null.

  rfe_issued:
    true if "Request for Evidence" is explicitly mentioned. false otherwise.

  noid_issued:
    true if "Notice of Intent to Deny" is explicitly mentioned. false otherwise.

  rfe_basis:
    Only if rfe_issued is true. Choose ONE:
      "Lack of independent corroboration"
      "Evidence insufficient"
      "Lack of originality"
      "General claims"
      "Evidence does not meet legal standard"
      "Overreliance on expert letters"
      "Other"
    Null if rfe_issued is false.

  noid_basis:
    Only if noid_issued is true. Choose ONE:
      "Lack of independent corroboration"
      "Evidence insufficient"
      "Lack of originality"
      "General claims"
      "Evidence does not meet legal standard"
      "Inconsistencies or contradictions"
      "Other"
    Null if noid_issued is false.

  denial_basis:
    Only if final_outcome is "Denied". Choose ONE:
      "Evidence too general"
      "Overreliance on expert letters"
      "Lack of independent corroboration"
      "Legal standard not met"
      "Criteria count insufficient"
      "Other"
    Null if not denied.

  final_merits_determination:
    Only for O-1A or EB-1A. "Pass" | "Fail" | null

  dhanasar_prong_failed:
    Only for EB-2 NIW denial. "Prong 1" | "Prong 2" | "Prong 3" | null

  basis_for_approval:
    Short paraphrase of key justification if approved. Null if denied.

  primary_basis_for_decision:
    Choose ONE:
      "Major Award" | "High Salary" | "Publications" | "Judging" | "Critical Role" | "Other"

  discretion_applied:
    true if "in our discretion" or "USCIS determines" appears explicitly.

  outcome_after_rfe:
    "approved" | "denied" | null

  outcome_after_noid:
    "approved" | "denied" | null

  SECONDARY FIELDS — these primarily live in the petition or evidence but extract them
  here if explicitly stated in this decision notice:
  {
    "petition_type": "string | null",
    "filing_date": "YYYY-MM-DD | null",
    "service_center_or_field_office": "string | null",
    "beneficiary_country_of_birth": "string | null",
    "beneficiary_country_of_citizenship": "string | null",
    "criteria_claimed_count": integer | null,
    "major_award_claimed": "Y | N | null",
    "publications_included": "Y | N | null",
    "judging_others_work_claimed": "Y | N | null",
    "high_salary_claimed": "Y | N | null",
    "eb2_basis": "Advanced Degree | Exceptional Ability | null",
    "endeavor_field": "Health | Energy | Tech | Public Policy | Other | null",
    "dhanasar_prong_focus": "Prong 1 | Prong 2 | Prong 3 | null"
  }

  WHERE TO LOOK FOR SECONDARY FIELDS IN A DECISION:
  - The decision header or opening paragraph often restates petition_type and filing_date
  - The officer's analysis section names the specific O-1A criteria evaluated —
    use this to populate criteria_claimed_count and the Y/N criteria fields
  - For EB-2 NIW decisions, the Dhanasar prong analysis names the prong focus and
    which prong failed
  - The service center name appears in the letterhead or footer

  Return EXACT JSON with ALL fields above (primary + secondary). Null for anything
  not found.

