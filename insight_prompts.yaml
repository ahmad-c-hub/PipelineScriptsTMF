evidence: |
  You are analyzing a LARGE USCIS evidence package (hundreds of pages).

  IMPORTANT:
  - This is NOT a form
  - This is NOT structured
  - You MUST scan for SIGNALS, not summarize

  STRATEGY:
  1. Scan document for keywords and patterns
  2. Detect relevant sections
  3. Extract ONLY final signals

  DO NOT:
  - Summarize
  - Copy text
  - Infer anything not clearly stated

  ────────────────────────────
  PRIMARY FIELDS — always extract these from the evidence package:

  included_publications:
    true if you detect journal articles, conference papers, arXiv/preprints,
    or Google Scholar references.

  cell_cited:
    true ONLY if the journal "Cell" is explicitly named.

  publication_type:
    Highest quality type present:
      "peer_reviewed_top_tier"  → Cell, Nature, Science, NEJM, Lancet
      "peer_reviewed_other"     → any other peer-reviewed journal
      "conference_paper"        → conference proceedings
      "preprint"                → arXiv, bioRxiv, SSRN
      "trade_publication"       → industry magazines
      "blog_or_whitepaper"      → blog posts, internal whitepapers
    null if no publications.

  basis_for_application:
    Array of ALL bases found, ordered by dominance (most evidence first):
      "Major Award" | "High Salary" | "Publications" | "Judging" |
      "Critical Role" | "Original Contributions"

  evidence_of_positioning_present:
    true if the package explicitly argues the beneficiary is "well positioned"
    to advance their proposed endeavor (EB-2 NIW Prong 2 language).
    false if absent. null if clearly O-1A or EB-1A.

  ────────────────────────────
  SECONDARY FIELDS — these primarily live in the petition or decision but extract
  them here if explicitly stated anywhere in this evidence package:
  {
    "petition_type": "string | null",
    "beneficiary_country_of_birth": "string | null",
    "beneficiary_country_of_citizenship": "string | null",
    "beneficiary_industry": "Tech | Pharmaceutical | Academic | Financial | Manufacturing | Other | null",
    "criteria_claimed_count": integer | null,
    "major_award_claimed": "Y | N | null",
    "publications_included_petition": "Y | N | null",
    "judging_others_work_claimed": "Y | N | null",
    "high_salary_claimed": "Y | N | null",
    "endeavor_field": "Health | Energy | Tech | Public Policy | Other | null",
    "national_importance_framing": "Economic | Health | Security | Environmental | null"
  }

  WHERE TO LOOK FOR SECONDARY FIELDS IN AN EVIDENCE PACKAGE:
  - The cover letter (first document in the package) explicitly lists O-1A criteria
    being claimed — use this for criteria_claimed_count and all Y/N criteria fields
  - The cover letter introduction states beneficiary background — country, industry
  - For NIW packages, the cover letter's "proposed endeavor" section reveals
    endeavor_field and national_importance_framing
  - Pay stub exhibits confirm high_salary_claimed
  - Award certificate exhibits confirm major_award_claimed
  - Publication exhibits confirm publications_included and publication_type

  ────────────────────────────
  Return EXACT JSON with ALL fields above (primary + secondary):
  {
    "included_publications": null,
    "cell_cited": null,
    "publication_type": null,
    "basis_for_application": null,
    "evidence_of_positioning_present": null,
    "petition_type": null,
    "beneficiary_country_of_birth": null,
    "beneficiary_country_of_citizenship": null,
    "beneficiary_industry": null,
    "criteria_claimed_count": null,
    "major_award_claimed": null,
    "publications_included_petition": null,
    "judging_others_work_claimed": null,
    "high_salary_claimed": null,
    "endeavor_field": null,
    "national_importance_framing": null
  }

